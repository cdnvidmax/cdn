<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDN Video Player</title>
  <style>
    /* Mode Gelap Total Sesuai Screenshot */
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .container {
      width: 100%;
      max-width: 850px;
      background-color: #0d0d0d;
      padding-bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    video {
      width: 100%;
      display: block;
      background-color: #000;
    }
    /* Link Biru Minimalis "Lihat selanjutnya" */
    .btn-next {
      color: #3b82f6;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      margin-top: 18px;
      transition: color 0.2s ease;
    }
    .btn-next:hover {
      color: #60a5fa;
      text-decoration: underline;
    }
    .error-text {
      color: #ef4444;
      padding: 30px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <video id="videoPlayer" controls autoplay muted>
      <source id="videoSource" type="video/mp4">
      Browser Anda tidak mendukung pemutar video ini.
    </video>

    <!-- Tombol menuju YouTube -->
    <a href="https://youtube.com" target="_blank" class="btn-next" id="actionLink">
      Lihat selanjutnya
    </a>

    <div id="noVideoMsg" class="error-text" style="display:none;">
      Silakan panggil file video pada URL. Contoh: /namafile.mp4
    </div>
  </div>

  <script>
    // Membaca parameter URL otomatis
    const urlParams = new URLSearchParams(window.location.search);
    const videoFile = urlParams.get('v');

    const player = document.getElementById('videoPlayer');
    const source = document.getElementById('videoSource');
    const linkBtn = document.getElementById('actionLink');
    const errorMsg = document.getElementById('noVideoMsg');

    if (videoFile) {
      // Masukkan video mp4 dari repositori statis secara dinamis
      source.src = videoFile;
      player.load();
    } else {
      player.style.display = 'none';
      linkBtn.style.display = 'none';
      errorMsg.style.display = 'block';
    }
  </script>

</body>
</html>
