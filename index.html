<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player Otomatis</title>
  <style>
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    .video-wrapper {
      width: 100%;
      max-width: 800px;
      background-color: #0d0d0d;
      padding-bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    video {
      width: 100%;
      display: block;
    }
    .next-link {
      color: #3b82f6;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      margin-top: 15px;
      transition: color 0.2s ease;
    }
    .next-link:hover {
      color: #60a5fa;
      text-decoration: underline;
    }
    .error-msg {
      color: #ef4444;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="video-wrapper">
    <!-- Pemutar Video -->
    <video id="myVideo" controls autoplay muted>
      <source id="videoSource" type="video/mp4">
      Browser Anda tidak mendukung pemutar video ini.
    </video>

    <!-- Tombol Otomatis di Bawah Kontrol Video -->
    <a href="https://youtube.com" target="_blank" class="next-link">
      Lihat selanjutnya
    </a>
    
    <div id="errorBox" class="error-msg" style="display:none;">
      Masukkan nama file video di URL. Contoh: ?v=namafile.mp4
    </div>
  </div>

  <script>
    // Mengambil nama file video secara otomatis dari parameter URL (?v=namafile.mp4)
    const urlParams = new URLSearchParams(window.location.search);
    const videoName = urlParams.get('v');

    const videoElement = document.getElementById('myVideo');
    const sourceElement = document.getElementById('videoSource');
    const errorBox = document.getElementById('errorBox');

    if (videoName) {
      // Mengarahkan sumber video ke file mp4 yang ada di folder repositori GitHub Anda
      sourceElement.src = videoName;
      videoElement.load();
    } else {
      // Jika tidak memasukkan parameter video, tampilkan pesan petunjuk
      videoElement.style.display = 'none';
      errorBox.style.display = 'block';
    }
  </script>

</body>
</html>
